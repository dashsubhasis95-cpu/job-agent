services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql://jobs:jobs@db:5432/jobs
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=3
    environment: *env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata: